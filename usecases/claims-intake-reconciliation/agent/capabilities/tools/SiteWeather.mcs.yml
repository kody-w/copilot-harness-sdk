mcs.metadata:
  componentName: "Site Weather"
  description: "Agent flow that returns the weather forecast for a location. Use only when the user asks about weather at a site, store, facility, or route. Requires a location."
kind: WorkflowTool
workflowId: 06769099-f203-4351-a16b-5bc872812c4a
toolInputs:
  - name: location
    displayName: location
    description: "City, region, postal code, or place name."
  - name: forecast_days
    displayName: forecast_days
    description: "Forecast days from 1 through 10. Defaults to 3."
toolOutputs:
  - name: status
  - name: message
  - name: location
  - name: timezone
  - name: current
  - name: forecast
  - name: source
