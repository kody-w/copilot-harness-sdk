content: |
  ---
  name: execution-report
  description: Produces the source-cited execution report for planogram changes. Use when the user asks for the execution report, a reset instruction packet review, or a comparison summary for specific record ids. Requires two record ids.
  ---
  # Execution report
  
  ## Step 1 - Establish the inputs
  You need the two record ids to compare (for example PLN-AISLE7-2026Q2 and PLN-AISLE7-2026Q3). If either is missing, ask for it before doing anything else.
  
  ## Step 2 - Gather
  1. Ask the Store Merchandising Reset Data Agent for both records.
  2. Search knowledge for the applicable policy or regulation.
  3. Only if the user asks for weather at a site, call Site Weather.
  
  ## Step 3 - Write the report (max 180 words)
  ```
  EXECUTION REPORT - <first id> -> <second id>
  Changes: <each change on its own line with the old -> new value>  [source]
  Missing items: <list or "none">  [source]
  Flags: <added, relocated, or discontinued SKUs>  [source]
  Rating: Low | Medium | High - one sentence why
  Recommended next step for district managers: <one sentence>
  ```
  
  ## Rules
  - Lead with the differences; a list of things that are fine is noise.
  - An item present in the first record but absent in the second is "missing".
  - Never invent a value. If a lookup returns nothing, write "not found".
  - Never say the reset instruction packet is approved, released, or final. Final store sign-off remain with the district managers.
  
