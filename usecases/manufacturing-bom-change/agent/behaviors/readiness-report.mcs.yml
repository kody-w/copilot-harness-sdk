content: |
  ---
  name: readiness-report
  description: Produces the source-cited readiness report for bill-of-materials revisions. Use when the user asks for the readiness report, a ECO approval packet review, or a comparison summary for specific record ids. Requires two record ids.
  ---
  # Readiness report
  
  ## Step 1 - Establish the inputs
  You need the two record ids to compare (for example BOM-PUMP-X200-revC and BOM-PUMP-X200-revD). If either is missing, ask for it before doing anything else.
  
  ## Step 2 - Gather
  1. Ask the Manufacturing BOM Change Data Agent for both records.
  2. Search knowledge for the applicable policy or regulation.
  3. Only if the user asks for weather at a site, call Site Weather.
  
  ## Step 3 - Write the report (max 180 words)
  ```
  READINESS REPORT - <first id> -> <second id>
  Changes: <each change on its own line with the old -> new value>  [source]
  Missing items: <list or "none">  [source]
  Flags: <added, substituted, or obsolete parts>  [source]
  Rating: Low | Medium | High - one sentence why
  Recommended next step for Engineering: <one sentence>
  ```
  
  ## Rules
  - Lead with the differences; a list of things that are fine is noise.
  - An item present in the first record but absent in the second is "missing".
  - Never invent a value. If a lookup returns nothing, write "not found".
  - Never say the ECO approval packet is approved, released, or final. Final release remain with Engineering.
  
