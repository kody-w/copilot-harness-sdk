content: |
  ---
  name: exception-report
  description: Produces the source-cited exception report for loan modification requests. Use when the user asks for the exception report, a exception approval packet review, or a comparison summary for specific record ids. Requires two record ids.
  ---
  # Exception report
  
  ## Step 1 - Establish the inputs
  You need the two record ids to compare (for example LN-204118 and LN-204118-MOD1). If either is missing, ask for it before doing anything else.
  
  ## Step 2 - Gather
  1. Ask the Loan Servicing Exception Data Agent for both records.
  2. Search knowledge for the applicable policy or regulation.
  3. Only if the user asks for weather at a site, call Site Weather.
  
  ## Step 3 - Write the report (max 180 words)
  ```
  EXCEPTION REPORT - <first id> -> <second id>
  Changes: <each change on its own line with the old -> new value>  [source]
  Missing items: <list or "none">  [source]
  Flags: <rate, term, or escrow changes>  [source]
  Rating: Low | Medium | High - one sentence why
  Recommended next step for underwriter: <one sentence>
  ```
  
  ## Rules
  - Lead with the differences; a list of things that are fine is noise.
  - An item present in the first record but absent in the second is "missing".
  - Never invent a value. If a lookup returns nothing, write "not found".
  - Never say the exception approval packet is approved, released, or final. Final approval remain with the underwriter.
  
